syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "OrderProcessing.Shipping";

service Shipping {
  rpc TrackShipment (TrackRequest) returns (stream TrackingEvent);
}

message TrackRequest {
  string shipment_id = 1;
  int32 after_sequence = 2;
}

message TrackingEvent {
  int32 sequence = 1;
  string status = 2;
  google.protobuf.Timestamp timestamp = 3;
}
